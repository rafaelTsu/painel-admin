services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: painel_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/painel_admin
      JWT_ACCESS_SECRET: dev-secret-access
      JWT_REFRESH_SECRET: dev-secret-refresh
      FILES_BASE_PATH: /app/files
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
      - app-files:/app/files

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres-data:
  app-files:
